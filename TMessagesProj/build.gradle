import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    alias libs.plugins.android.application
    alias libs.plugins.google.gms.google.services
    alias libs.plugins.google.firebase.crashlytics
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/third_party'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/sqlite')
        ]
    }
}

def buildTimestamp = System.getenv('BUILD_TIMESTAMP') ?: (System.currentTimeMillis() as String)
def buildTimeFormatted = new Date().format('yyyyMMddHHmm')
def commitId = System.getenv('COMMIT_ID')
def verName = "${APP_VERSION_NAME}${commitId?.take(7) ? "-${commitId.take(7)}" : ''}"
def verCode = (APP_VERSION_CODE ?: 7038) as Integer

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def keystorePwd = null
def alias = null
def pwd = null

Properties properties
def base64 = System.getenv('LOCAL_PROPERTIES')
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file('local.properties').exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

if (properties != null) {
    keystorePwd = properties.getProperty('KEYSTORE_PASS')
    alias = properties.getProperty('ALIAS_NAME')
    pwd = properties.getProperty('ALIAS_PASS')
}

keystorePwd = keystorePwd ?: System.getenv('KEYSTORE_PASS')
alias = alias ?: System.getenv('ALIAS_NAME')
pwd = pwd ?: System.getenv('ALIAS_PASS')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    tasks.configureEach { task ->
        if (
            task.name.toLowerCase().contains('cmake') ||
            task.name.toLowerCase().contains('jni') ||
            task.name.toLowerCase().contains('test')
        ) {
            task.enabled = false
        }
    }
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            enable = true
            reset()
            universalApk = false
            if (nativeTarget == 'universal') {
                universalApk = true
                include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else if (!nativeTarget.isBlank()) {
                include nativeTarget
            } else {
                include 'arm64-v8a'
            }
        }
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // obtain your own keys at https://core.telegram.org/api/obtaining_api_id
        def appId = '1767756'
        def appHash = '1e68d58758ef7f6913c4431544a3d7bc'

        if (properties != null) {
            appId = properties.getProperty('TELEGRAM_APP_ID') ?: System.getenv('TELEGRAM_APP_ID') ?: appId
            appHash = properties.getProperty('TELEGRAM_APP_HASH') ?: properties.getProperty('TELEGRAM_APP_ASH') ?: System.getenv('TELEGRAM_APP_HASH') ?: appHash
        }

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + verName + '"'
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', appId
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'
        buildConfigField 'boolean', 'DEBUG_VERSION', 'false'
        buildConfigField 'boolean', 'DEBUG_PRIVATE_VERSION', 'false'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-27', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.22.1'
            path = 'jni/CMakeLists.txt'
        }
    }

    signingConfigs {
        release {
            if (keystorePwd != null && !keystorePwd.isEmpty()) {
                storeFile project.file('release.keystore')
                storePassword keystorePwd
                keyAlias alias
                keyPassword pwd
            } else {
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = true
            multiDexEnabled = true
            signingConfig = signingConfigs.release
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }

        release {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/', './libs/']

    namespace = 'org.telegram.messenger'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'NegramXFE'
            String first = String.format('%s-v%s(%s)', gramName, verName, buildTimeFormatted)
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // official
    implementation libs.core.ktx
    implementation libs.palette.ktx
    implementation libs.exifinterface
    implementation libs.dynamicanimation
    implementation libs.mediarouter
    implementation libs.sharetarget
    implementation libs.interpolator
    implementation libs.biometric
    implementation libs.app
    implementation libs.app.projected
    implementation libs.nanohttpd
    compileOnly libs.checker.qual
    compileOnly libs.checker.compat.qual
    implementation libs.firebase.messaging
    implementation libs.firebase.crashlytics
    implementation libs.play.services.cast.framework
    implementation libs.play.services.maps
    implementation libs.play.services.auth
    implementation libs.play.services.vision
    implementation libs.play.services.wearable
    implementation libs.play.services.location
    implementation libs.isoparser
    implementation libs.language.id
    implementation libs.gson
    implementation (libs.guava) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
    implementation libs.play.services.mlkit.subject.segmentation
    implementation libs.play.services.mlkit.image.labeling
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.core
    implementation libs.ext.strikethrough
    implementation libs.ext.tables
    implementation libs.html
    implementation libs.inline.parser
    implementation(libs.ext.latex) {
        exclude group: 'ru.noties', module: 'jlatexmath-android'
    }
    api project(':jlatexmath')
    implementation 'com.google.android.recaptcha:recaptcha:18.7.1'
    implementation 'com.google.android.play:integrity:1.3.0'
    configurations.configureEach {
        exclude group: 'com.google.crypto.tink', module: 'tink-android'
    }
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // payment
    implementation(libs.stripe.android) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    implementation libs.billing
    coreLibraryDesugaring libs.desugar.jdk.libs.nio

    // kotlin
    implementation libs.kotlinx.coroutines.android
    // utilities
    implementation 'com.google.zxing:core:3.5.4'
    implementation libs.android.sdk
    implementation libs.material
    implementation libs.osmdroid.android
    // network
    implementation libs.okhttp
    implementation libs.dnsjava
    // add for emoji
    implementation libs.truetypeparser.light
    // add for UnifiedPush
    implementation libs.connector
    // add for save deleted messages
    implementation libs.room.runtime
    // add for keep formatting in translations
    implementation libs.commons.text
    // translator from nekogram
    implementation libs.translator

    // dexmaker for python plugins
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.3'

    compileOnly fileTree('libs')
}
